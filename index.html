<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Santa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="snow" aria-hidden="true"></div>
    <main class="card">
      <p class="eyebrow">Mackey Family Secret Santa 2026</p>
      <h1>Who did you get?</h1>
      <p class="lede">Enter the code that was sent just to you.</p>

      <form id="lookup-form">
        <label for="code">Your code</label>
        <input
          id="code"
          name="code"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="MAPLE-04"
          required
        />
        <button type="submit">Reveal my person</button>
      </form>

      <p id="error" class="message error" hidden></p>
      <section id="result" class="result" hidden>
        <p class="result-kicker"><span id="your-name"></span>, you’re shopping for</p>
        <p id="drew-name" class="drew-name"></p>
        <p class="hint">Keep it a secret — no group-chat screenshots.</p>
        <p class="wishlist">
          <a
            href="https://docs.google.com/document/d/1L31rTev2R2oJKvr2Z41HXUZQF-ochukpsXsPqlyRBK0/edit?tab=t.b1cwk5ttsc0l"
            target="_blank"
            rel="noopener noreferrer"
            >Click here to see the family gift wish list</a>
        </p>
        <button type="button" id="reset-btn">Start over</button>
      </section>
    </main>
    <p class="photo-credit">
      Photo:
      <a href="https://en.wikipedia.org/wiki/File:Plaza_Night.jpg">Country Club Plaza at night</a>
      by Hngrange,
      <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>
    </p>
    <script src="app.js"></script>
  </body>
</html>
